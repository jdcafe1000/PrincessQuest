<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Quest Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#FBEAF4; --sky2:#E9DDFB; --card:#FFFFFF; --ink:#43245C; --soft:#7A5C93;
  --plum:#5B2E83; --lilac:#CDB4F0; --rose:#F07FAE; --gold:#F2B431; --gold-deep:#C98A0C;
  --copper:#D2582A; --line:#EBD9F5; --empty:#F6EEFB; --on-plum:#FFFFFF;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#1F1230; --sky2:#2A1744; --card:#2F1D49; --ink:#FBEFFF; --soft:#C9B2E0;
    --plum:#B98BE8; --lilac:#6B4A99; --rose:#F58DB8; --gold:#F6C453; --gold-deep:#F6C453;
    --line:#46306A; --empty:#3A2659; --on-plum:#1F1230;
  }
}
:root[data-theme="dark"]{
  --sky:#1F1230; --sky2:#2A1744; --card:#2F1D49; --ink:#FBEFFF; --soft:#C9B2E0;
  --plum:#B98BE8; --lilac:#6B4A99; --rose:#F58DB8; --gold:#F6C453; --gold-deep:#F6C453;
  --line:#46306A; --empty:#3A2659; --on-plum:#1F1230;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-weight:500;
  background:var(--sky);
  background-image:
    radial-gradient(circle at 12% 8%, var(--sky2) 0 140px, transparent 141px),
    radial-gradient(circle at 92% 30%, var(--sky2) 0 200px, transparent 201px);
  background-attachment:fixed;
  min-height:100%;
}
main{max-width:980px; margin:0 auto; padding:16px 14px 40px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose); outline-offset:2px}

/* Header */
.hero{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center}
.portrait{width:120px; height:132px; flex:none}
h1{font-family:var(--display); font-weight:800; font-size:clamp(1.7rem,6vw,2.9rem); line-height:1.02; margin:0; color:var(--plum); letter-spacing:-.01em}
h1 .name{color:var(--copper)}
.week{margin:.35rem 0 0; font-weight:700; color:var(--soft); font-size:1.02rem}
.hero input{
  font-family:var(--display); font-weight:800; color:var(--copper);
  border:0; border-bottom:3px dashed var(--lilac); background:transparent; width:7.5ch; min-width:0; padding:0;
  font-size:inherit;
}
.week input{font-family:var(--body); font-weight:700; color:var(--ink); font-size:inherit; width:9ch; border-bottom-width:2px}

/* Path to the castle */
.path{margin:18px 0 6px; background:var(--card); border:2px solid var(--line); border-radius:22px; padding:12px 14px 14px}
.path-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:800}
.path-top span:last-child{color:var(--soft); font-weight:700; font-size:.92rem}
.track{position:relative; height:18px; border-radius:99px; background:var(--empty); margin:14px 30px 2px 6px}
.fill{position:absolute; inset:0 auto 0 0; width:0; border-radius:99px; background:linear-gradient(90deg,var(--rose),var(--gold)); transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.walker,.castle{position:absolute; top:50%; transform:translate(-50%,-58%); font-size:1.7rem; line-height:1}
.walker{left:0; transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.castle{left:calc(100% + 16px); font-size:2rem}

/* Quests */
.quests{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px}
.quest{
  background:var(--card); border:2px solid var(--line); border-radius:22px; padding:10px 12px;
  display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"icon text extra" "days days days"; gap:8px 10px; align-items:center;
}
.quest.done{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.icon{grid-area:icon; width:42px; height:42px; border-radius:14px; border:0; background:var(--empty); font-size:1.4rem; line-height:1; padding:0}
.icon:disabled{cursor:default; opacity:1}
.text{grid-area:text; font-weight:800; font-size:1.05rem; line-height:1.2; min-width:0; overflow-wrap:anywhere}
.text input{width:100%; border:2px solid var(--line); border-radius:12px; padding:7px 10px; background:var(--card); font-weight:800}
.extra{grid-area:extra; display:flex; gap:6px; align-items:center}
.worth{font-weight:800; color:var(--gold-deep); font-size:.92rem; white-space:nowrap}
.money{display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:12px; padding:0 8px; background:var(--card); font-weight:800}
.money input{border:0; background:transparent; width:4.2ch; padding:7px 0 7px 2px; font-weight:800; min-width:0}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--rose)}
.remove{width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:var(--card); font-weight:800; color:var(--soft)}
.days{grid-area:days; display:flex; gap:6px; justify-content:space-between}
.day{
  flex:1 1 0; max-width:54px; aspect-ratio:1; min-width:0; border-radius:50%;
  border:2px dashed var(--lilac); background:var(--empty); color:var(--soft);
  font-family:var(--display); font-weight:700; font-size:.82rem; padding:0; position:relative;
  display:grid; place-items:center;
}
.day svg{position:absolute; inset:12%; width:76%; height:76%; opacity:0; transform:scale(.2) rotate(-40deg)}
.day[aria-pressed="true"]{border:2px solid var(--rose); background:color-mix(in srgb,var(--rose) 22%,var(--card)); color:transparent}
.day[aria-pressed="true"] svg{opacity:1; transform:none}
.day.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.ribbon{display:none; grid-column:1/-1; text-align:center; font-family:var(--display); font-weight:700; color:var(--gold-deep); font-size:.95rem}
.quest.done .ribbon{display:block}

/* Treasure */
.treasure{
  margin-top:16px; border-radius:26px; padding:16px; background:var(--plum); color:var(--on-plum);
  display:grid; gap:10px; grid-template-columns:1fr auto; align-items:center;
}
.treasure h2{font-family:var(--display); font-weight:800; font-size:1.35rem; margin:0; line-height:1.1}
.treasure p{margin:.2rem 0 0; font-weight:700; opacity:.9; font-size:.95rem}
.chest{display:flex; align-items:center; background:var(--card); color:var(--ink); border:4px solid var(--gold); border-radius:20px; padding:4px 14px; font-family:var(--display); font-weight:800; font-size:2rem}
.chest input{border:0; background:transparent; width:4.6ch; font-family:var(--display); font-weight:800; font-size:inherit; padding:4px 0 4px 4px; min-width:0}
.chest input:focus{outline:none}
.sum{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-weight:700}
.sum[hidden]{display:none}

/* Controls */
.controls{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.btn{border:2px solid var(--plum); background:var(--card); color:var(--plum); border-radius:99px; padding:10px 16px; font-weight:800}
.btn.primary{background:var(--plum); color:var(--on-plum)}
.btn.warn{border-color:var(--copper); color:var(--copper)}
.btn.small{padding:6px 12px; border-color:var(--gold); color:var(--ink); background:var(--gold)}
.note{margin:12px 2px 0; color:var(--soft); font-weight:700; font-size:.92rem; min-height:1.2em}
.add{justify-self:start}

@media (min-width:760px){
  main{padding:28px 24px 56px}
  .portrait{width:170px; height:187px}
  .quest{grid-template-columns:auto minmax(0,1fr) auto auto; grid-template-areas:"icon text extra days"; padding:10px 16px}
  .days{gap:8px}
  .day{flex:none; width:46px; font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){
  .day.pop svg{animation:none} .fill,.walker{transition:none}
}
@media print{
  :root{--sky:#fff;--sky2:#fff;--card:#fff;--ink:#43245C;--soft:#7A5C93;--plum:#5B2E83;--lilac:#CDB4F0;--rose:#F07FAE;--gold:#F2B431;--gold-deep:#C98A0C;--line:#EBD9F5;--empty:#fff;--on-plum:#fff}
  body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .controls,.note,.sum,.remove,.add{display:none !important}
  .quest{break-inside:avoid; grid-template-columns:auto minmax(0,1fr) auto auto; grid-template-areas:"icon text extra days"}
  .day{flex:none; width:40px}
  .quests{gap:6px}
}
</style>
</head>
<body>
<main>
  <header class="hero">
    <svg class="portrait" viewBox="0 0 200 220" role="img" aria-label="A smiling princess with long red hair, freckles and a gold crown">
      <path d="M100 30C50 30 33 76 40 122c4 28-16 44-4 74 16 16 36 6 38-14h52c2 20 22 30 38 14 12-30-8-46-4-74 7-46-10-92-60-92Z" fill="#D2582A"/>
      <path d="M44 150c-6 18-10 30-4 44M158 150c6 18 10 30 4 44M60 170c-2 10-4 18-10 24M140 170c2 10 4 18 10 24" stroke="#F08A4B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M52 220c3-36 25-50 48-50s45 14 48 50Z" fill="#B99AE8"/>
      <path d="M78 176c6 12 38 12 44 0" stroke="#F2B431" stroke-width="6" stroke-linecap="round" fill="none"/>
      <rect x="89" y="148" width="22" height="30" rx="10" fill="#FFD3B5"/>
      <ellipse cx="100" cy="112" rx="43" ry="46" fill="#FFDCC2"/>
      <path d="M57 108C54 66 82 50 102 50c22 0 46 16 41 58-8-22-22-34-40-38-10 16-28 22-46 38Z" fill="#D2582A"/>
      <path d="M70 88c10-8 20-14 32-18" stroke="#F08A4B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="84" cy="114" r="5.5" fill="#2E7D5B"/><circle cx="116" cy="114" r="5.5" fill="#2E7D5B"/>
      <circle cx="86" cy="112" r="1.8" fill="#fff"/><circle cx="118" cy="112" r="1.8" fill="#fff"/>
      <path d="M76 106c4-5 12-5 16-1M108 105c4-4 12-4 16 1" stroke="#9C3D1B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="73" cy="130" r="8" fill="#F8A5B8" opacity=".55"/><circle cx="127" cy="130" r="8" fill="#F8A5B8" opacity=".55"/>
      <g fill="#D98B5F"><circle cx="90" cy="126" r="1.4"/><circle cx="96" cy="123" r="1.4"/><circle cx="104" cy="123" r="1.4"/><circle cx="110" cy="126" r="1.4"/><circle cx="100" cy="127" r="1.4"/></g>
      <path d="M88 136q12 12 24 0" stroke="#C0445A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M70 54l7-32 13 20 10-28 10 28 13-20 7 32Z" fill="#F2B431" stroke="#C98A0C" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="100" cy="40" r="5" fill="#F07FAE"/><circle cx="82" cy="45" r="3.5" fill="#7ED0C0"/><circle cx="118" cy="45" r="3.5" fill="#7ED0C0"/>
      <circle cx="77" cy="21" r="3.5" fill="#fff" stroke="#C98A0C" stroke-width="2"/><circle cx="100" cy="13" r="3.5" fill="#fff" stroke="#C98A0C" stroke-width="2"/><circle cx="123" cy="21" r="3.5" fill="#fff" stroke="#C98A0C" stroke-width="2"/>
    </svg>
    <div>
      <h1 id="title"></h1>
      <p class="week" id="week"></p>
    </div>
  </header>

  <section class="path" aria-live="polite">
    <div class="path-top"><span>The road to the castle</span><span id="count"></span></div>
    <div class="track"><div class="fill" id="fill"></div><span class="walker" id="walker" aria-hidden="true">👑</span><span class="castle" aria-hidden="true">🏰</span></div>
  </section>

  <ul class="quests" id="quests"></ul>

  <section class="treasure">
    <div>
      <h2>Treasure chest</h2>
      <p>What the princess earned this week</p>
    </div>
    <label class="chest"><span aria-hidden="true">$</span><input id="chest" inputmode="decimal" aria-label="Dollars earned this week" placeholder="0"></label>
    <div class="sum" id="sum" hidden><span id="sumText"></span><button class="btn small" id="useSum" type="button">Put it in the chest</button></div>
  </section>

  <div class="controls">
    <button class="btn primary" id="edit" type="button">Edit quests</button>
    <button class="btn warn" id="newWeek" type="button">Start a new week</button>
  </div>
  <p class="note" id="note" role="status"></p>
</main>

<script>
(function(){
  var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ICONS=["🛏️","🦷","🧸","🍽️","📚","💖","🦄","🐶","🧹","👗","🎒","🌟","🎨","🥦","🎵","🌷"];
  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l2.9 6.4 7 .8-5.2 4.7 1.4 6.9L12 17.1l-6.1 3.5 1.4-6.9L2.1 9l7-.8z" fill="#F2B431" stroke="#C98A0C" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  var KEY="princess-quest-chart-v1";

  function monday(){
    var d=new Date(), back=(d.getDay()+6)%7; d.setDate(d.getDate()-back);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }
  function blank(){return [false,false,false,false,false,false,false]}
  function q(icon,text){return {id:Math.random().toString(36).slice(2,9),icon:icon,text:text,value:"",days:blank()}}
  function defaults(){
    return {name:"",weekOf:monday(),chest:"",quests:[
      q("🛏️","Make my royal bed"),
      q("🦷","Brush teeth, morning and night"),
      q("🧸","Tidy up my toys"),
      q("🍽️","Help set the table"),
      q("📚","Read for 15 minutes"),
      q("💖","Use kind words and listen the first time"),
      q("🦄","Brave challenge: try something new")
    ]};
  }

  var state=defaults(), editing=false, armed=false, db=null, saving=false, dirty=false;
  var $=function(id){return document.getElementById(id)};

  function valid(s){return s&&Array.isArray(s.quests)}
  try{var cached=JSON.parse(localStorage.getItem(KEY)||"null"); if(valid(cached)) state=cached;}catch(e){}

  function el(tag,attrs,kids){
    var n=document.createElement(tag);
    for(var k in attrs||{}){
      if(k==="text") n.textContent=attrs[k];
      else if(k==="html") n.innerHTML=attrs[k];
      else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),attrs[k]);
      else if(attrs[k]!==false&&attrs[k]!=null) n.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){n.appendChild(c)});
    return n;
  }
  function money(n){return "$"+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"")}

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    if(!db) return;
    if(saving){dirty=true;return}
    saving=true;
    (async function(){
      do{
        dirty=false;
        try{await db.doc("chart/state").set({json:JSON.stringify(state)})}
        catch(e){$("note").textContent="Changes on this screen could not be saved to the shared chart."; break}
      }while(dirty);
      saving=false;
    })();
  }

  function renderHeader(){
    var h=$("title"), w=$("week"); h.textContent=""; w.textContent="";
    if(editing){
      h.appendChild(document.createTextNode("Princess "));
      h.appendChild(el("input",{value:state.name,placeholder:"name","aria-label":"Princess name",maxlength:"18",
        oninput:function(e){state.name=e.target.value; save()}}));
      h.appendChild(document.createTextNode("’s quests"));
      w.appendChild(document.createTextNode("Week of "));
      w.appendChild(el("input",{value:state.weekOf,"aria-label":"Week of",maxlength:"14",
        oninput:function(e){state.weekOf=e.target.value; save()}}));
    }else{
      h.appendChild(document.createTextNode("Princess "));
      h.appendChild(el("span",{class:"name",text:(state.name||"").trim()?state.name.trim()+"’s":"of the week’s"}));
      h.appendChild(document.createTextNode(" quests"));
      w.textContent="Week of "+state.weekOf;
    }
  }

  function renderProgress(){
    var total=state.quests.length*7, got=0, sum=0, priced=false;
    state.quests.forEach(function(x){
      var c=x.days.filter(Boolean).length, v=parseFloat(x.value);
      got+=c; if(v>0){priced=true; sum+=c*v}
    });
    var pct=total?got/total*100:0;
    $("fill").style.width=pct+"%"; $("walker").style.left=pct+"%";
    $("count").textContent=total&&got===total?"You made it to the castle!":got+" of "+total+" stars";
    $("sum").hidden=!priced;
    $("sumText").textContent="Stars so far add up to "+money(sum);
    $("useSum").onclick=function(){state.chest=money(sum).slice(1); $("chest").value=state.chest; save()};
  }

  function renderQuests(){
    var list=$("quests"); list.textContent="";
    state.quests.forEach(function(x,qi){
      var li=el("li",{class:"quest"+(x.days.every(Boolean)?" done":"")});
      li.appendChild(el("button",{class:"icon",type:"button",text:x.icon,disabled:editing?null:"",
        "aria-label":editing?"Change picture":null,"aria-hidden":editing?null:"true",
        onclick:function(e){x.icon=ICONS[(ICONS.indexOf(x.icon)+1)%ICONS.length]; e.currentTarget.textContent=x.icon; save()}}));
      var text=el("div",{class:"text"});
      if(editing) text.appendChild(el("input",{value:x.text,"aria-label":"Quest "+(qi+1),maxlength:"60",placeholder:"Name this quest",
        oninput:function(e){x.text=e.target.value; save()}}));
      else text.textContent=x.text||"New quest";
      li.appendChild(text);
      var extra=el("div",{class:"extra"});
      if(editing){
        extra.appendChild(el("label",{class:"money",title:"Dollars per star"},[el("span",{text:"$","aria-hidden":"true"}),
          el("input",{value:x.value,inputmode:"decimal",placeholder:"0","aria-label":"Dollars per star for "+x.text,
            oninput:function(e){x.value=e.target.value.replace(/[^0-9.]/g,""); renderProgress(); save()}})]));
        extra.appendChild(el("button",{class:"remove",type:"button",text:"✕","aria-label":"Remove "+x.text,
          onclick:function(){state.quests.splice(qi,1); renderQuests(); renderProgress(); save()}}));
      }else if(parseFloat(x.value)>0){
        extra.appendChild(el("span",{class:"worth",text:money(parseFloat(x.value))+" a star"}));
      }
      li.appendChild(extra);
      var days=el("div",{class:"days",role:"group","aria-label":x.text});
      DAYS.forEach(function(d,di){
        days.appendChild(el("button",{class:"day",type:"button","aria-pressed":String(!!x.days[di]),"aria-label":d,html:d+STAR,
          onclick:function(e){
            x.days[di]=!x.days[di];
            var b=e.currentTarget; b.setAttribute("aria-pressed",String(x.days[di]));
            b.classList.remove("pop"); if(x.days[di]){void b.offsetWidth; b.classList.add("pop")}
            li.classList.toggle("done",x.days.every(Boolean));
            renderProgress(); save();
          }}));
      });
      li.appendChild(days);
      li.appendChild(el("div",{class:"ribbon",text:"A perfect week for this quest!"}));
      list.appendChild(li);
    });
    if(editing) list.appendChild(el("li",{style:"display:grid"},[el("button",{class:"btn add",type:"button",text:"Add a quest",
      onclick:function(){state.quests.push(q("🌟","")); renderQuests(); renderProgress(); save();
        var ins=list.querySelectorAll(".text input"); if(ins.length) ins[ins.length-1].focus()}})]));
  }

  function render(){
    renderHeader(); renderQuests(); renderProgress();
    $("chest").value=state.chest||"";
    $("edit").textContent=editing?"Done editing":"Edit quests";
  }

  $("chest").addEventListener("input",function(e){state.chest=e.target.value.replace(/[^0-9.]/g,""); e.target.value=state.chest; save()});
  $("edit").addEventListener("click",function(){
    editing=!editing; render();
    $("note").textContent=editing?"Rename quests, tap a picture to change it, and set dollars per star if you like.":"";
  });
  $("newWeek").addEventListener("click",function(e){
    if(!armed){armed=true; e.currentTarget.textContent="Tap again to clear all stars";
      setTimeout(function(){armed=false; $("newWeek").textContent="Start a new week"},4000); return}
    armed=false; e.currentTarget.textContent="Start a new week";
    state.quests.forEach(function(x){x.days=blank()}); state.chest=""; state.weekOf=monday();
    render(); save(); $("note").textContent="Fresh week, fresh stars.";
  });

  render();

  (async function(){
    if(!(window.claude&&window.claude.use)) return;
    try{
      db=await window.claude.use("db"); if(!db) return;
      var ref=db.doc("chart/state");
      ref.onSnapshot(function(snap){
        if(!snap.exists||snap.metadata.hasPendingWrites||saving) return;
        var a=document.activeElement; if(a&&a.tagName==="INPUT") return;
        var d=snap.data(); if(!d||typeof d.json!=="string"||d.json===JSON.stringify(state)) return;
        try{var s=JSON.parse(d.json); if(valid(s)){state=s; try{localStorage.setItem(KEY,d.json)}catch(e){} render()}}catch(e){}
      },function(){});
    }catch(e){db=null}
  })();
})();
</script>
</body>
</html>
