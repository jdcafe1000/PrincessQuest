<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Princess Quest Chart</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 46 L14 16 L24 31 L32 10 L40 31 L50 16 L56 46 Z' fill='%23F2B431' stroke='%23C98A0C' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#5B2E83">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="Princess Quest">
<meta name="application-name" content="Princess Quest">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#FBEAF4; --sky2:#E9DDFB; --card:#FFFFFF; --ink:#43245C; --soft:#7A5C93;
  --plum:#5B2E83; --lilac:#CDB4F0; --rose:#F07FAE; --gold:#F2B431; --gold-deep:#C98A0C;
  --copper:#D2582A; --line:#EBD9F5; --empty:#F6EEFB; --on-plum:#FFFFFF;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#1F1230; --sky2:#2A1744; --card:#2F1D49; --ink:#FBEFFF; --soft:#C9B2E0;
    --plum:#B98BE8; --lilac:#6B4A99; --rose:#F58DB8; --gold:#F6C453; --gold-deep:#F6C453;
    --line:#46306A; --empty:#3A2659; --on-plum:#1F1230;
  }
}
:root[data-theme="dark"]{
  --sky:#1F1230; --sky2:#2A1744; --card:#2F1D49; --ink:#FBEFFF; --soft:#C9B2E0;
  --plum:#B98BE8; --lilac:#6B4A99; --rose:#F58DB8; --gold:#F6C453; --gold-deep:#F6C453;
  --line:#46306A; --empty:#3A2659; --on-plum:#1F1230;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:var(--body); color:var(--ink); font-weight:500;
  background:var(--sky);
  background-image:
    radial-gradient(circle at 12% 8%, var(--sky2) 0 140px, transparent 141px),
    radial-gradient(circle at 92% 30%, var(--sky2) 0 200px, transparent 201px);
  background-attachment:fixed;
  min-height:100%;
}
main{max-width:980px; margin:0 auto; padding:16px 14px 40px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose); outline-offset:2px}

/* Header */
.hero{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center}
.portrait{width:120px; height:132px; flex:none}
h1{font-family:var(--display); font-weight:800; font-size:clamp(1.7rem,6vw,2.9rem); line-height:1.02; margin:0; color:var(--plum); letter-spacing:-.01em}
h1 .name{color:var(--copper)}
.week{margin:.35rem 0 0; font-weight:700; color:var(--soft); font-size:1.02rem}
.hero input{
  font-family:var(--display); font-weight:800; color:var(--copper);
  border:0; border-bottom:3px dashed var(--lilac); background:transparent; width:7.5ch; min-width:0; padding:0;
  font-size:inherit;
}
.week input{font-family:var(--body); font-weight:700; color:var(--ink); font-size:inherit; width:9ch; border-bottom-width:2px}

/* Path to the castle */
.path{margin:18px 0 6px; background:var(--card); border:2px solid var(--line); border-radius:22px; padding:12px 14px 14px}
.path-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:800}
.path-top span:last-child{color:var(--soft); font-weight:700; font-size:.92rem}
.track{position:relative; height:18px; border-radius:99px; background:var(--empty); margin:14px 30px 2px 6px}
.fill{position:absolute; inset:0 auto 0 0; width:0; border-radius:99px; background:linear-gradient(90deg,var(--rose),var(--gold)); transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.walker,.castle{position:absolute; top:50%; transform:translate(-50%,-58%); font-size:1.7rem; line-height:1}
.walker{left:0; transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.castle{left:calc(100% + 16px); font-size:2rem}

/* Quests */
.quests{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px}
.quest{
  background:var(--card); border:2px solid var(--line); border-radius:22px; padding:10px 12px;
  display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"icon text extra" "days days days"; gap:8px 10px; align-items:center;
}
.quest.done{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.icon{grid-area:icon; width:42px; height:42px; border-radius:14px; border:0; background:var(--empty); font-size:1.4rem; line-height:1; padding:0}
.icon:disabled{cursor:default; opacity:1}
.text{grid-area:text; font-weight:800; font-size:1.05rem; line-height:1.2; min-width:0; overflow-wrap:anywhere}
.text input{width:100%; border:2px solid var(--line); border-radius:12px; padding:7px 10px; background:var(--card); font-weight:800}
.extra{grid-area:extra; display:flex; gap:6px; align-items:center}
.worth{font-weight:800; color:var(--gold-deep); font-size:.92rem; white-space:nowrap}
.money{display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:12px; padding:0 8px; background:var(--card); font-weight:800}
.money input{border:0; background:transparent; width:4.2ch; padding:7px 0 7px 2px; font-weight:800; min-width:0}
.money input:focus{outline:none}
.money:focus-within{border-color:var(--rose)}
.remove{width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:var(--card); font-weight:800; color:var(--soft)}
.days{grid-area:days; display:flex; gap:6px; justify-content:space-between}
.day{
  flex:1 1 0; max-width:54px; aspect-ratio:1; min-width:0; border-radius:50%;
  border:2px dashed var(--lilac); background:var(--empty); color:var(--soft);
  font-family:var(--display); font-weight:700; font-size:.82rem; padding:0; position:relative;
  display:grid; place-items:center;
}
.day svg{position:absolute; inset:12%; width:76%; height:76%; opacity:0; transform:scale(.2) rotate(-40deg)}
.day[aria-pressed="true"]{border:2px solid var(--rose); background:color-mix(in srgb,var(--rose) 22%,var(--card)); color:transparent}
.day[aria-pressed="true"] svg{opacity:1; transform:none}
.day.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.ribbon{display:none; grid-column:1/-1; text-align:center; font-family:var(--display); font-weight:700; color:var(--gold-deep); font-size:.95rem}
.quest.done .ribbon{display:block}

/* Treasure */
.treasure{
  margin-top:16px; border-radius:26px; padding:16px; background:var(--plum); color:var(--on-plum);
  display:grid; gap:10px; grid-template-columns:1fr auto; align-items:center;
}
.treasure h2{font-family:var(--display); font-weight:800; font-size:1.35rem; margin:0; line-height:1.1}
.treasure p{margin:.2rem 0 0; font-weight:700; opacity:.9; font-size:.95rem}
.chest{display:flex; align-items:center; background:var(--card); color:var(--ink); border:4px solid var(--gold); border-radius:20px; padding:4px 14px; font-family:var(--display); font-weight:800; font-size:2rem}
.chest input{border:0; background:transparent; width:4.6ch; font-family:var(--display); font-weight:800; font-size:inherit; padding:4px 0 4px 4px; min-width:0}
.chest input:focus{outline:none}
.sum{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-weight:700}
.sum[hidden]{display:none}

/* Controls */
.controls{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.btn{border:2px solid var(--plum); background:var(--card); color:var(--plum); border-radius:99px; padding:10px 16px; font-weight:800}
.btn.primary{background:var(--plum); color:var(--on-plum)}
.btn.warn{border-color:var(--copper); color:var(--copper)}
.btn.small{padding:6px 12px; border-color:var(--gold); color:var(--ink); background:var(--gold)}
.note{margin:12px 2px 0; color:var(--soft); font-weight:700; font-size:.92rem; min-height:1.2em}
.add{justify-self:start}

/* Past weeks */
.history{display:grid; gap:8px; margin-top:14px}
.past-week{background:var(--card); border:2px solid var(--line); border-radius:18px; overflow:hidden}
.week-head{
  width:100%; display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between; align-items:baseline;
  background:none; border:0; padding:11px 14px; text-align:left; font-weight:800; color:var(--ink);
}
.week-when{font-family:var(--display)}
.week-score{color:var(--soft); font-weight:700; font-size:.92rem}
.week-body{list-style:none; margin:0; padding:2px 14px 12px; display:grid; gap:7px; border-top:2px solid var(--line)}
.week-body li{display:flex; gap:9px; align-items:center; font-weight:700; font-size:.95rem}
.week-icon{flex:none}
.week-text{flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
.week-days{flex:none; display:flex; gap:4px}
.week-days i{width:11px; height:11px; border-radius:50%; background:var(--empty); border:1.5px solid var(--lilac)}
.week-days i.on{background:var(--gold); border-color:var(--gold-deep)}
.week-chest{color:var(--gold-deep); font-weight:800}

/* Week-complete celebration */
.cheer{
  position:fixed; inset:0; z-index:50; display:none; place-items:center; overflow:hidden;
  padding:24px calc(18px + env(safe-area-inset-right,0px)) 24px calc(18px + env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 50% 38%, var(--sky2) 0%, var(--sky) 70%);
  text-align:center;
}
.cheer[data-open="true"]{display:grid}
.cheer-inner{position:relative; z-index:2; display:grid; gap:12px; justify-items:center; max-width:540px}
.cheer .portrait{width:min(52vw,200px); height:auto; filter:drop-shadow(0 12px 26px rgba(67,36,92,.28))}
.cheer h2{
  margin:0; font-family:var(--display); font-weight:800; color:var(--plum);
  font-size:clamp(2rem,9vw,3.1rem); line-height:1.04; letter-spacing:-.01em;
}
.cheer p{margin:0; font-weight:800; color:var(--ink); font-size:clamp(1rem,4.2vw,1.2rem)}
.cheer .prize{color:var(--gold-deep)}
.cheer .btn{margin-top:6px}
.cheer-stars{position:absolute; inset:0; z-index:1; pointer-events:none}
.cheer-stars span{
  position:absolute; left:var(--x); top:var(--y); width:var(--w); height:var(--w);
  transform:translate(-50%,-50%) scale(0); opacity:0;
  animation:cheer-star .9s cubic-bezier(.2,1.5,.4,1) var(--d) forwards,
            cheer-twinkle 2.6s ease-in-out calc(var(--d) + .9s) infinite;
}
.cheer-stars svg{display:block; width:100%; height:100%}
.cheer .portrait{animation:cheer-pop .7s cubic-bezier(.2,1.4,.4,1) both}
.cheer h2{animation:cheer-rise .5s ease-out .18s both}
.cheer p,.cheer .btn{animation:cheer-rise .5s ease-out .32s both}
@keyframes cheer-pop{from{transform:scale(.35); opacity:0} 65%{transform:scale(1.05)} to{transform:scale(1); opacity:1}}
@keyframes cheer-rise{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}
@keyframes cheer-star{
  from{transform:translate(-50%,-50%) scale(0) rotate(-45deg); opacity:0}
  55%{opacity:1}
  to{transform:translate(-50%,-50%) scale(1) rotate(10deg); opacity:1}
}
@keyframes cheer-twinkle{0%,100%{opacity:1} 50%{opacity:.5}}

@media (min-width:760px){
  main{padding:28px 24px 56px}
  .portrait{width:170px; height:187px}
  .quest{grid-template-columns:auto minmax(0,1fr) auto auto; grid-template-areas:"icon text extra days"; padding:10px 16px}
  .days{gap:8px}
  .day{flex:none; width:46px; font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){
  .day.pop svg{animation:none} .fill,.walker{transition:none}
  .cheer .portrait,.cheer h2,.cheer p,.cheer .btn{animation:none}
  .cheer-stars span{animation:none; transform:translate(-50%,-50%) scale(1); opacity:1}
}
@media print{
  :root{--sky:#fff;--sky2:#fff;--card:#fff;--ink:#43245C;--soft:#7A5C93;--plum:#5B2E83;--lilac:#CDB4F0;--rose:#F07FAE;--gold:#F2B431;--gold-deep:#C98A0C;--line:#EBD9F5;--empty:#fff;--on-plum:#fff}
  body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .controls,.note,.sum,.remove,.add,.history{display:none !important}
  .cheer{display:none !important}
  .quest{break-inside:avoid; grid-template-columns:auto minmax(0,1fr) auto auto; grid-template-areas:"icon text extra days"}
  .day{flex:none; width:40px}
  .quests{gap:6px}
}
</style>
</head>
<body>

  <header class="hero">
    <svg class="portrait" viewBox="0 0 200 220" role="img" aria-label="A smiling princess with long red hair, freckles and a gold crown">
      <path d="M100 30C50 30 33 76 40 122c4 28-16 44-4 74 16 16 36 6 38-14h52c2 20 22 30 38 14 12-30-8-46-4-74 7-46-10-92-60-92Z" fill="#D2582A"/>
      <path d="M44 150c-6 18-10 30-4 44M158 150c6 18 10 30 4 44M60 170c-2 10-4 18-10 24M140 170c2 10 4 18 10 24" stroke="#F08A4B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M52 220c3-36 25-50 48-50s45 14 48 50Z" fill="#B99AE8"/>

  <section class="path" aria-live="polite">

     aria-label="The whole week is full of stars"></div>

<script src="sync.js"></script>
<script>
(function(){
  var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ICONS=["🛏️","🦷","🧸","🍽️","📚","💖","🦄","🐶","🧹","👗","🎒","🌟","🎨","🥦","🎵","🌷"];
  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l2.9 6.4 7 .8-5.2 4.7 1.4 6.9L12 17.1l-6.1 3.5 1.4-6.9L2.1 9l7-.8z" fill="#F2B431" stroke="#C98A0C" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  var KEY="princess-quest-chart-v1";

  function mondayDate(){
    var d=new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate()-((d.getDay()+6)%7));
    return d;
  }
  // weekOf is a label people edit and read differently by locale, so the
  // rollover turns on this key instead. Two devices must always agree.
  function mondayKey(){
    var d=mondayDate(), p=function(n){return (n<10?"0":"")+n};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  function monday(){
    return mondayDate().toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }
  function blank(){return [false,false,false,false,false,false,false]}
  function q(icon,text){return {id:Math.random().toString(36).slice(2,9),icon:icon,text:text,value:"",days:blank()}}
  function defaults(){
    return {name:"",weekOf:monday(),weekKey:mondayKey(),chest:"",history:[],quests:[
      q("🛏️","Make my royal bed"),
      q("🦷","Brush teeth, morning and night"),
      q("🧸","Tidy up my toys"),
      q("🍽️","Help set the table"),
      q("📚","Read for 15 minutes"),
      q("💖","Use kind words and listen the first time"),
      q("🦄","Brave challenge: try something new")
    ]};
  }

  var state=defaults(), editing=false, armed=false, db=null, saving=false, dirty=false;
  var wasDone=null, cheering=false, rollReady=false, historyOpen=false, openWeek=null;
  var MAX_HISTORY=52;
  var CHEER_KEY="princess-quest-cheered-v1";
  var $=function(id){return document.getElementById(id)};

  function valid(s){return s&&Array.isArray(s.quests)}
  function normalize(s){
    if(!Array.isArray(s.history)) s.history=[];
    if(typeof s.weekKey!=="string") s.weekKey="";
    return s;
  }
  try{var cached=JSON.parse(localStorage.getItem(KEY)||"null"); if(valid(cached)) state=normalize(cached);}catch(e){}

  function el(tag,attrs,kids){
    var n=document.createElement(tag);
    for(var k in attrs||{}){
      if(k==="text") n.textContent=attrs[k];
      else if(k==="html") n.innerHTML=attrs[k];
      else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),attrs[k]);
      else if(attrs[k]!==false&&attrs[k]!=null) n.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){n.appendChild(c)});
    return n;
  }
  function money(n){return "$"+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"")}

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    if(!db) return;
    if(saving){dirty=true;return}
    saving=true;
    (async function(){
      do{
        dirty=false;
        try{await db.doc("chart/state").set({json:JSON.stringify(state)})}
        catch(e){$("note").textContent="Changes on this screen could not be saved to the shared chart."; break}
      }while(dirty);
      saving=false;
    })();
  }

  // ---- archiving a finished week ----------------------------------------
  function snapshotWeek(){
    return {
      key:state.weekKey||mondayKey(), week:state.weekOf, chest:state.chest||"",
      quests:state.quests.map(function(q){
        return {icon:q.icon, text:q.text, value:q.value||"",
                days:q.days.map(function(b){return b?"1":"0"}).join("")};
      })
    };
  }

  function weekStats(w){
    var got=0,total=0,sum=0;
    w.quests.forEach(function(q){
      var c=(q.days.match(/1/g)||[]).length, v=parseFloat(q.value);
      got+=c; total+=7; if(v>0) sum+=c*v;
    });
    return {got:got,total:total,sum:sum};
  }

  // File the current week away and start the one beginning on `key`.
  // An untouched week is not worth keeping, so it is dropped rather than filed.
  function rollTo(key,label){
    var week=snapshotWeek(), st=weekStats(week);
    if(st.got>0||(state.chest||"").trim()){
      state.history=(state.history||[]).filter(function(w){return w.key!==week.key});
      state.history.unshift(week);
      if(state.history.length>MAX_HISTORY) state.history.length=MAX_HISTORY;
    }
    state.quests.forEach(function(q){q.days=blank()});
    state.chest=""; state.weekKey=key; state.weekOf=label;
    openWeek=null; wasDone=null;
    try{localStorage.removeItem(CHEER_KEY)}catch(e){}
  }

  // Runs on load, whenever the page comes back to the front, and on a timer,
  // since a tablet can sit on this page for days. Held until the first shared
  // state arrives so a stale copy never files a week the other household owns.
  function checkRollover(){
    if(!rollReady) return;
    var key=mondayKey();
    if(!state.weekKey){state.weekKey=key; save(); return}
    if(state.weekKey===key) return;
    closeCheer();
    rollTo(key,monday());
    render(); save();
    $("note").textContent="A new week has begun. Last week is filed under Past weeks.";
  }

  function readyToRoll(){ if(rollReady) return; rollReady=true; checkRollover(); }

  function closeCheer(){
    if(!cheering) return;
    cheering=false;
    $("cheer").setAttribute("data-open","false");
    $("cheer").textContent="";
  }

  // Once per week per device: the other parent's screen cheers too, but only
  // when their copy actually fills up, and never again on a reload.
  function maybeCheer(t){
    var seen=null;
    try{seen=localStorage.getItem(CHEER_KEY)}catch(e){}
    if(seen===state.weekKey) return;
    try{localStorage.setItem(CHEER_KEY,state.weekKey)}catch(e){}
    cheer(t);
  }

  function cheer(t){
    var box=$("cheer");
    box.textContent="";

    var field=el("div",{class:"cheer-stars","aria-hidden":"true"});
    for(var i=0;i<22;i++){
      var sp=el("span",{html:STAR});
      sp.style.setProperty("--x",(4+Math.random()*92).toFixed(2)+"%");
      sp.style.setProperty("--y",(4+Math.random()*92).toFixed(2)+"%");
      sp.style.setProperty("--w",(12+Math.random()*30).toFixed(0)+"px");
      sp.style.setProperty("--d",(Math.random()*1.2).toFixed(2)+"s");
      field.appendChild(sp);
    }
    box.appendChild(field);

    var inner=el("div",{class:"cheer-inner"});
    var art=document.querySelector("header .portrait");
    if(art){
      var face=art.cloneNode(true);
      face.removeAttribute("role"); face.removeAttribute("aria-label");
      face.setAttribute("aria-hidden","true");
      inner.appendChild(face);
    }
    inner.appendChild(el("h2",{text:"Congratulations!"}));
    var who=(state.name||"").trim();
    inner.appendChild(el("p",{text:(who?who+", you":"You")+" filled every star this week!"}));
    if(t.sum>0) inner.appendChild(el("p",{class:"prize",text:"The treasure chest holds "+money(t.sum)+"."}));
    var btn=el("button",{class:"btn primary",type:"button",text:"Back to the chart",onclick:closeCheer});
    inner.appendChild(btn);
    box.appendChild(inner);

    box.setAttribute("data-open","true");
    cheering=true;
    try{btn.focus()}catch(e){}
  }

  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeCheer() });
  $("cheer").addEventListener("click",function(e){ if(e.target===e.currentTarget) closeCheer() });

  function renderHeader(){
    var h=$("title"), w=$("week"); h.textContent=""; w.textContent="";
    if(editing){
      h.appendChild(document.createTextNode("Princess "));
      h.appendChild(el("input",{value:state.name,placeholder:"name","aria-label":"Princess name",maxlength:"18",
        oninput:function(e){state.name=e.target.value; save()}}));
      h.appendChild(document.createTextNode("’s quests"));
      w.appendChild(document.createTextNode("Week of "));
      w.appendChild(el("input",{value:state.weekOf,"aria-label":"Week of",maxlength:"14",
        oninput:function(e){state.weekOf=e.target.value; save()}}));
    }else{
      h.appendChild(document.createTextNode("Princess "));
      h.appendChild(el("span",{class:"name",text:(state.name||"").trim()?state.name.trim()+"’s":"of the week’s"}));
      h.appendChild(document.createTextNode(" quests"));
      w.textContent="Week of "+state.weekOf;
    }
  }

  function totals(){
    var t={total:state.quests.length*7, got:0, sum:0, priced:false};
    state.quests.forEach(function(x){
      var c=x.days.filter(Boolean).length, v=parseFloat(x.value);
      t.got+=c; if(v>0){t.priced=true; t.sum+=c*v}
    });
    t.done = t.total>0 && t.got===t.total;
    return t;
  }

  function renderProgress(){
    var t=totals(), pct=t.total?t.got/t.total*100:0;
    $("fill").style.width=pct+"%"; $("walker").style.left=pct+"%";
    $("count").textContent=t.done?"You made it to the castle!":t.got+" of "+t.total+" stars";
    $("sum").hidden=!t.priced;
    $("sumText").textContent="Stars so far add up to "+money(t.sum);
    $("useSum").onclick=function(){state.chest=money(t.sum).slice(1); $("chest").value=state.chest; save()};

    // Only on the move into a full week, so a reload or a poll never re-fires.
    if(wasDone===null) wasDone=t.done;
    else if(t.done&&!wasDone) maybeCheer(t);
    wasDone=t.done;
  }

  function renderQuests(){
    var list=$("quests"); list.textContent="";
    state.quests.forEach(function(x,qi){
      var li=el("li",{class:"quest"+(x.days.every(Boolean)?" done":"")});
      li.appendChild(el("button",{class:"icon",type:"button",text:x.icon,disabled:editing?null:"",
        "aria-label":editing?"Change picture":null,"aria-hidden":editing?null:"true",
        onclick:function(e){x.icon=ICONS[(ICONS.indexOf(x.icon)+1)%ICONS.length]; e.currentTarget.textContent=x.icon; save()}}));
      var text=el("div",{class:"text"});
      if(editing) text.appendChild(el("input",{value:x.text,"aria-label":"Quest "+(qi+1),maxlength:"60",placeholder:"Name this quest",
        oninput:function(e){x.text=e.target.value; save()}}));
      else text.textContent=x.text||"New quest";
      li.appendChild(text);
      var extra=el("div",{class:"extra"});
      if(editing){
        extra.appendChild(el("label",{class:"money",title:"Dollars per star"},[el("span",{text:"$","aria-hidden":"true"}),
          el("input",{value:x.value,inputmode:"decimal",placeholder:"0","aria-label":"Dollars per star for "+x.text,
            oninput:function(e){x.value=e.target.value.replace(/[^0-9.]/g,""); renderProgress(); save()}})]));
        extra.appendChild(el("button",{class:"remove",type:"button",text:"✕","aria-label":"Remove "+x.text,
          onclick:function(){state.quests.splice(qi,1); renderQuests(); renderProgress(); save()}}));
      }else if(parseFloat(x.value)>0){
        extra.appendChild(el("span",{class:"worth",text:money(parseFloat(x.value))+" a star"}));
      }
      li.appendChild(extra);
      var days=el("div",{class:"days",role:"group","aria-label":x.text});
      DAYS.forEach(function(d,di){
        days.appendChild(el("button",{class:"day",type:"button","aria-pressed":String(!!x.days[di]),"aria-label":d,html:d+STAR,
          onclick:function(e){
            x.days[di]=!x.days[di];
            var b=e.currentTarget; b.setAttribute("aria-pressed",String(x.days[di]));
            b.classList.remove("pop"); if(x.days[di]){void b.offsetWidth; b.classList.add("pop")}
            li.classList.toggle("done",x.days.every(Boolean));
            renderProgress(); save();
          }}));
      });
      li.appendChild(days);
      li.appendChild(el("div",{class:"ribbon",text:"A perfect week for this quest!"}));
      list.appendChild(li);
    });
    if(editing) list.appendChild(el("li",{style:"display:grid"},[el("button",{class:"btn add",type:"button",text:"Add a quest",
      onclick:function(){state.quests.push(q("🌟","")); renderQuests(); renderProgress(); save();
        var ins=list.querySelectorAll(".text input"); if(ins.length) ins[ins.length-1].focus()}})]));
  }

  function renderHistory(){
    var list=state.history||[], panel=$("history"), btn=$("past");
    btn.hidden=!list.length;
    btn.textContent=historyOpen?"Hide past weeks":"Past weeks ("+list.length+")";
    btn.setAttribute("aria-expanded",String(historyOpen&&!!list.length));
    panel.hidden=!historyOpen||!list.length;
    panel.textContent="";
    if(panel.hidden) return;

    list.forEach(function(w){
      var st=weekStats(w), isOpen=openWeek===w.key;
      var head=el("button",{class:"week-head",type:"button","aria-expanded":String(isOpen),
        onclick:function(){openWeek=isOpen?null:w.key; renderHistory()}});
      head.appendChild(el("span",{class:"week-when",text:"Week of "+w.week}));
      head.appendChild(el("span",{class:"week-score",
        text:st.got+" of "+st.total+" stars"+(st.sum>0?" · "+money(st.sum):"")}));
      var item=el("div",{class:"past-week"},[head]);

      if(isOpen){
        var body=el("ul",{class:"week-body"});
        w.quests.forEach(function(q){
          var earned=(q.days.match(/1/g)||[]).length;
          var li=el("li",{},[
            el("span",{class:"week-icon",text:q.icon,"aria-hidden":"true"}),
            el("span",{class:"week-text",text:q.text||"Quest"})
          ]);
          var dots=el("span",{class:"week-days",role:"img","aria-label":earned+" of 7 days"});
          for(var i=0;i<7;i++) dots.appendChild(el("i",{class:q.days.charAt(i)==="1"?"on":null}));
          li.appendChild(dots);
          body.appendChild(li);
        });
        if((w.chest||"").trim()) body.appendChild(el("li",{class:"week-chest",text:"Treasure chest: $"+w.chest}));
        item.appendChild(body);
      }
      panel.appendChild(item);
    });
  }

  function render(){
    renderHeader(); renderQuests(); renderProgress(); renderHistory();
    $("chest").value=state.chest||"";
    $("edit").textContent=editing?"Done editing":"Edit quests";
  }

  $("chest").addEventListener("input",function(e){state.chest=e.target.value.replace(/[^0-9.]/g,""); e.target.value=state.chest; save()});
  $("edit").addEventListener("click",function(){
    editing=!editing; render();
    $("note").textContent=editing?"Rename quests, tap a picture to change it, and set dollars per star if you like.":"";
  });
  $("newWeek").addEventListener("click",function(e){
    if(!armed){armed=true; e.currentTarget.textContent="Tap again to file this week away";
      setTimeout(function(){armed=false; $("newWeek").textContent="Start a new week"},4000); return}
    armed=false; e.currentTarget.textContent="Start a new week";
    closeCheer();
    rollTo(mondayKey(),monday());
    render(); save();
    $("note").textContent="Fresh week, fresh stars. Last week is filed under Past weeks.";
  });

  $("past").addEventListener("click",function(){historyOpen=!historyOpen; renderHistory()});

  document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkRollover() });
  window.addEventListener("focus",checkRollover);
  setInterval(checkRollover,10*60*1000);

  render();

  (async function(){
    setTimeout(readyToRoll,3000);
    if(!(window.claude&&window.claude.use)){readyToRoll(); return}
    try{
      db=await window.claude.use("db"); if(!db){readyToRoll(); return}
      var ref=db.doc("chart/state"), firstSnap=true;
      ref.onSnapshot(function(snap){
        if(!snap.exists||snap.metadata.hasPendingWrites||saving) return;
        var a=document.activeElement; if(a&&a.tagName==="INPUT") return;
        var d=snap.data(); if(!d||typeof d.json!=="string") return;
        if(d.json===JSON.stringify(state)){firstSnap=false; readyToRoll(); return}
        try{var s=JSON.parse(d.json); if(valid(s)){
          state=normalize(s); try{localStorage.setItem(KEY,d.json)}catch(e){}
          // Catching up with a week someone else already finished is not a
          // moment to celebrate, so take the first shared state as the baseline.
          if(firstSnap){wasDone=null; firstSnap=false; render(); readyToRoll(); return}
          render();
        }}catch(e){}
      },function(){});
    }catch(e){db=null; readyToRoll()}
  })();
})();
</script>
</body>
</html>
